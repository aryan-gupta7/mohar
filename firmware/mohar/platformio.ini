; Mohar device firmware. "dev" has test commands that can break one-time-key safety; "release" does not.
[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
monitor_speed = 115200
upload_speed = 115200
build_flags = -O2 -DCONT_STACKSIZE=6144

[env:dev]
build_flags = ${env.build_flags} -DMOHAR_DEV=1

[env:release]

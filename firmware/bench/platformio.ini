; First hardware test: chip info, Keccak speed, one-time signing cost, heap.
; No Wi-Fi and no credentials are needed for this one.
[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_speed = 115200
build_flags = -O2
